# Netlify build settings (base directory: frontend).
# Publish the Vite build output, never the source index.html that references /src/main.tsx.
[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the FastAPI backend hosted on Render (Netlify cannot run Python servers).
[[redirects]]
  from = "/api/*"
  to = "https://undo-4ul2.onrender.com/api/:splat"
  status = 200
  force = true

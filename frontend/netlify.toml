# Netlify build settings (base directory: frontend).
# Publish the Vite build output, never the source index.html that references /src/main.tsx.
[build]
  command = "npm run build"
  publish = "dist"

# /api/* is forwarded to the FastAPI backend on Render by netlify/edge-functions/api-proxy.ts.
# A plain proxy rewrite forwarded the browser Origin (backend rejected every POST with 403) and buffered the SSE stream.
